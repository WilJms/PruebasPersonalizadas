substitutions:
  _REGION: us-central1
  _REPOSITORY: comprehension-verification
  _IMAGE: application
  _VITE_SUPABASE_URL: https://replace-with-project-ref.supabase.co
  _VITE_SUPABASE_PUBLISHABLE_KEY: replace-with-publishable-key

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --label
      - org.opencontainers.image.revision=$COMMIT_SHA
      - --build-arg
      - VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}
      - --build-arg
      - VITE_SUPABASE_PUBLISHABLE_KEY=${_VITE_SUPABASE_PUBLISHABLE_KEY}
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - .

  - id: smoke-runtime-locally
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID"
        container="cva-smoke-$BUILD_ID"
        cleanup() {
          docker rm --force "$${container}" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        docker run --detach --name "$${container}" \
          --env CVA_ENVIRONMENT=local \
          --env CVA_DATABASE_URL=sqlite+pysqlite:////tmp/stage1.db \
          --env CVA_AUTH_MODE=local \
          --env CVA_OBJECT_STORE_MODE=memory \
          --env CVA_JOB_RUNNER_MODE=inline \
          --env CVA_MODEL_MODE=mock \
          --env CVA_P10_ENABLED=false \
          --env CVA_SESSION_SECRET=not-a-secret-cloud-build-smoke-session-key \
          "$${image}"
        for attempt in $$(seq 1 30); do
          if docker exec "$${container}" python -c \
            "import requests; requests.get('http://127.0.0.1:8080/api/readiness', timeout=2).raise_for_status()"; then
            break
          fi
          if [ "$${attempt}" -eq 30 ]; then
            exit 1
          fi
          sleep 1
        done
        docker exec "$${container}" python -c \
          "import requests; r=requests.get('http://127.0.0.1:8080/api/health', timeout=2); r.raise_for_status(); assert r.json()['status'] == 'ok'"
        docker exec "$${container}" python -c \
          "import requests; r=requests.get('http://127.0.0.1:8080/api/readiness', timeout=2); r.raise_for_status(); assert r.json() == {'status': 'ready'}"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED

timeout: 1800s
