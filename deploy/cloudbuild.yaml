substitutions:
  _REGION: us-central1
  _REPOSITORY: comprehension-verification
  _IMAGE: application
  _VITE_SUPABASE_URL: https://replace-with-project-ref.supabase.co
  _VITE_SUPABASE_PUBLISHABLE_KEY: replace-with-publishable-key

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --label
      - org.opencontainers.image.revision=$COMMIT_SHA
      - --build-arg
      - VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}
      - --build-arg
      - VITE_SUPABASE_PUBLISHABLE_KEY=${_VITE_SUPABASE_PUBLISHABLE_KEY}
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - .

  - id: smoke-runtime-locally
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID"
        container="cva-smoke-$BUILD_ID"
        cleanup() {
          docker rm --force "$${container}" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        docker run --detach --name "$${container}" \
          --env CVA_ENVIRONMENT=local \
          --env CVA_DATABASE_URL=sqlite+pysqlite:////tmp/stage1.db \
          --env CVA_AUTH_MODE=local \
          --env CVA_OBJECT_STORE_MODE=memory \
          --env CVA_JOB_RUNNER_MODE=inline \
          --env CVA_MODEL_MODE=mock \
          --env CVA_P10_ENABLED=false \
          --env CVA_SESSION_SECRET=cloud-build-smoke-secret-not-production \
          "$${image}"
        for attempt in $$(seq 1 30); do
          if docker exec "$${container}" python -c \
            "import requests; requests.get('http://127.0.0.1:8080/api/readiness', timeout=2).raise_for_status()"; then
            break
          fi
          if [ "$${attempt}" -eq 30 ]; then
            exit 1
          fi
          sleep 1
        done
        docker exec "$${container}" python -c \
          "import requests; r=requests.get('http://127.0.0.1:8080/api/health', timeout=2); r.raise_for_status(); assert r.json()['status'] == 'ok'"
        docker exec "$${container}" python -c \
          "import requests; r=requests.get('http://127.0.0.1:8080/api/readiness', timeout=2); r.raise_for_status(); assert r.json() == {'status': 'ready'}"

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID

  - id: resolve-immutable-image
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        tagged_image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID"
        digest=""
        for attempt in $$(seq 1 12); do
          digest="$$(gcloud artifacts docker images describe "$${tagged_image}" \
            --project="$PROJECT_ID" \
            --format='value(image_summary.digest)' 2>/dev/null || true)"
          if printf '%s\n' "$${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            break
          fi
          sleep 5
        done
        if ! printf '%s\n' "$${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
          echo "Artifact Registry did not return a valid sha256 digest" >&2
          exit 1
        fi
        repository_image="$${tagged_image%:*}"
        immutable_image="$${repository_image}@$${digest}"
        printf '%s\n' "$${immutable_image}" | tee /workspace/container-image.txt
        echo "Terraform is the only deployment owner; pass this digest reference through an unversioned tfvars file."

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
