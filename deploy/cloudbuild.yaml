substitutions:
  _REGION: us-central1
  _REPOSITORY: comprehension-verification
  _IMAGE: application
  _SERVICE_NAME: cva-web
  _JOB_NAME: cva-worker
  _DEPLOY_RUNTIME: "true"
  _VITE_SUPABASE_URL: https://replace-with-project-ref.supabase.co
  _VITE_SUPABASE_PUBLISHABLE_KEY: replace-with-publishable-key

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --label
      - org.opencontainers.image.revision=$COMMIT_SHA
      - --build-arg
      - VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}
      - --build-arg
      - VITE_SUPABASE_PUBLISHABLE_KEY=${_VITE_SUPABASE_PUBLISHABLE_KEY}
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID

  - id: update-service
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        if [ "${_DEPLOY_RUNTIME}" = "true" ]; then
          gcloud run services update "${_SERVICE_NAME}" \
            --project="$PROJECT_ID" \
            --region="${_REGION}" \
            --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID" \
            --quiet
        fi

  - id: update-job
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        if [ "${_DEPLOY_RUNTIME}" = "true" ]; then
          gcloud run jobs update "${_JOB_NAME}" \
            --project="$PROJECT_ID" \
            --region="${_REGION}" \
            --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID" \
            --quiet
        fi

  - id: verify-service-configuration
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        if [ "${_DEPLOY_RUNTIME}" = "true" ]; then
          gcloud run services describe "${_SERVICE_NAME}" \
            --project="$PROJECT_ID" \
            --region="${_REGION}" \
            --format='value(status.url)'
        fi

  - id: verify-service-health
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        if [ "${_DEPLOY_RUNTIME}" = "true" ]; then
          service_url="$$(gcloud run services describe "${_SERVICE_NAME}" --project="$PROJECT_ID" --region="${_REGION}" --format='value(status.url)')"
          curl --fail --retry 6 --retry-delay 5 --show-error "$${service_url}/api/health"
        fi

  - id: verify-job-configuration
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        if [ "${_DEPLOY_RUNTIME}" = "true" ]; then
          gcloud run jobs describe "${_JOB_NAME}" \
            --project="$PROJECT_ID" \
            --region="${_REGION}" \
            --format='value(name)'
        fi

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
